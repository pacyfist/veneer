<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>veneer — an Angular library: readable by people, gibberish to bots</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="An Angular library that keeps your text readable for people while scrapers, AI crawlers and copy-paste get gibberish. One attribute, works with SSR."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="veneer — an Angular library: readable by people, gibberish to bots"
    />
    <meta
      property="og:description"
      content="An Angular library: your readers see your words, scrapers get gibberish. Try the live demo."
    />
    <meta property="og:url" content="https://www.pacyfist.dev/veneer/" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- The very font veneer reads outlines from: protected and ordinary text
         must be the same typeface, or the swap is visible. The URL is the one
         provideVeneer() fetches, relative to <base href>, so the browser
         downloads the file once and both uses share it. -->
    <style>
      @font-face {
        font-family: 'Roboto';
        src: url('fonts/Roboto-Regular.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
