name: CI

# Checks every Angular major the library's peerDependencies accept. The library
# is built once, with the oldest major, because that is the build npm gets (see
# publish.yml): partially compiled code links in newer Angular, not older. Each
# major then builds the demo against that very build and runs the e2e suite.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: node scripts/use-angular.mjs 20

      - run: npm run build:lib

      - uses: actions/upload-artifact@v4
        with:
          name: library
          path: dist/pacyfist/veneer

  demo:
    needs: library
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        angular: [20, 21, 22]
    name: demo (Angular ${{ matrix.angular }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: node scripts/use-angular.mjs ${{ matrix.angular }}

      - uses: actions/download-artifact@v4
        with:
          name: library
          path: dist/pacyfist/veneer

      # Angular 20's unit-test builder is experimental and cannot test a
      # library project, so the specs run on 21 and newer only.
      - name: Unit tests
        if: matrix.angular >= 21
        run: npx ng test @pacyfist/veneer --watch=false

      - name: Build static site
        run: npx ng build demo --configuration production,github-pages

      - run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e
        env:
          ANGULAR_MAJOR: ${{ matrix.angular }}
