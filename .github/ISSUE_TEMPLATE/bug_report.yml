name: Bug report
description: Something in @pacyfist/veneer does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A security problem, such as readable text leaking into
        served HTML, should be reported privately instead (see SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected to see instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: Steps, or a link to a minimal repository. Include your `provideVeneer()` config.
      render: ts
    validations:
      required: true

  - type: input
    id: veneer-version
    attributes:
      label: veneer version
      placeholder: '0.0.2'
    validations:
      required: true

  - type: input
    id: angular-version
    attributes:
      label: Angular version
      description: The output of `ng version`, or at least `@angular/core`.
      placeholder: '21.2.0'
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      description: Where it fails, and where it works if you tried others.
      placeholder: 'Safari 19.1 on macOS (works in Chrome 152)'
    validations:
      required: true

  - type: dropdown
    id: font-format
    attributes:
      label: Base font format
      options:
        - TTF
        - OTF
        - WOFF
        - WOFF2
        - Other
    validations:
      required: true

  - type: dropdown
    id: rendering
    attributes:
      label: Rendering
      options:
        - SSR on (rendered per request, with hydration)
        - SSR on (prerendered / static site generation)
        - SSR off (client-side rendering only)
    validations:
      required: true

  - type: dropdown
    id: change-detection
    attributes:
      label: Change detection
      options:
        - Zoneless
        - zone.js
        - Not sure

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Anything logged in the browser console, especially lines starting with `[veneer]`.
      render: text
